
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | OneCart Admin</title>

    <link rel="stylesheet" th:href="@{/css/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin-profile.css}">
</head>

<body>

    <!-- Existing admin sidebar -->
    <div th:replace="~{fragments/sidebar :: adminSidebar}"></div>

    <main class="main-content">

        <div class="page-header">
            <div>
                <div class="breadcrumb">
                    OneCart / Admin / My Profile
                </div>

                <h1>My Profile</h1>
                <p>Manage your administrator account information.</p>
            </div>

            <div class="header-user">
                <div class="header-avatar">OC</div>
                <div>
                    <strong>OneCart Administrator</strong>
                    <span>Super Admin</span>
                </div>
            </div>
        </div>

        <div class="profile-container">

            <!-- Profile summary -->
            <section class="profile-card">

                <div class="profile-avatar"
                     th:text="${#strings.substring(admin.firstName, 0, 1).toUpperCase()}">
                    A
                </div>

                <h2 th:text="${admin.firstName + ' ' + admin.lastName}">
                    Admin Name
                </h2>

                <p th:text="${admin.email}">admin@example.com</p>

                <span class="role-badge">Administrator</span>

                <div class="profile-divider"></div>

                <div class="profile-info">
                    <span>Account Role</span>
                    <strong>ADMIN</strong>
                </div>

                <div class="profile-info">
                    <span>Account Status</span>
                    <strong class="active-status">Active</strong>
                </div>

            </section>

            <!-- Editable profile form -->
            <section class="edit-card">

                <div class="section-heading">
                    <div>
                        <h2>Personal Information</h2>
                        <p>Update your administrator profile details.</p>
                    </div>
                </div>

                <div class="alert success-alert"
                     th:if="${successMessage}"
                     th:text="${successMessage}">
                </div>

                <div class="alert error-alert"
                     th:if="${errorMessage}"
                     th:text="${errorMessage}">
                </div>

                <form th:action="@{/admin/profile/update}"
                      method="post">

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}">

                    <div class="form-grid">

                        <div class="form-group">
                            <label>First Name</label>
                            <input type="text"
                                   name="firstName"
                                   th:value="${admin.firstName}"
                                   placeholder="Enter first name"
                                   required>
                        </div>

                        <div class="form-group">
                            <label>Last Name</label>
                            <input type="text"
                                   name="lastName"
                                   th:value="${admin.lastName}"
                                   placeholder="Enter last name"
                                   required>
                        </div>

                        <div class="form-group">
                            <label>Email Address</label>
                            <input type="email"
                                   name="email"
                                   th:value="${admin.email}"
                                   placeholder="Enter email address"
                                   required>
                        </div>

                        <div class="form-group">
                            <label>Phone Number</label>
                            <input type="tel"
                                   name="phone"
                                   th:value="${admin.phone}"
                                   placeholder="Enter phone number">
                        </div>

                        <div class="form-group full-width">
                            <label>Account Role</label>
                            <input type="text"
                                   value="Administrator"
                                   readonly>
                        </div>

                    </div>

                    <div class="form-actions">
                        <button type="reset" class="cancel-btn">
                            Reset
                        </button>

                        <button type="submit" class="save-btn">
                            Save Changes
                        </button>
                    </div>

                </form>

            </section>

        </div>

    </main>

</body>
</html>
