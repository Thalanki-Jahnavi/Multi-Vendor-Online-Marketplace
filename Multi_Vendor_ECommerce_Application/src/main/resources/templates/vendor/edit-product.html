
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product | OneCart</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: "Segoe UI", Arial, sans-serif;
        }

        body {
            margin: 0;
            padding: 35px;
            background: #f3f8f7;
            color: #123e3a;
        }

        .container {
            max-width: 750px;
            margin: 20px auto;
            background: white;
            padding: 35px;
            border-radius: 14px;
            border: 1px solid #e4eeeb;
        }

        h1 {
            margin-top: 0;
        }

        .subtitle {
            color: #78918c;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #dce8e5;
            border-radius: 8px;
            font-size: 14px;
        }

        input:focus {
            outline: none;
            border-color: #087e78;
        }

        .buttons {
            display: flex;
            gap: 12px;
            margin-top: 25px;
        }

        button, .back-btn {
            border: none;
            padding: 12px 22px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            font-size: 14px;
        }

        button {
            background: #087e78;
            color: white;
        }

        .back-btn {
            background: #e5f4f0;
            color: #123e3a;
        }

        .error {
            background: #fce9e7;
            color: #bd5147;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 18px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Edit Product</h1>
    <p class="subtitle">Update your product information.</p>

    <div class="error"
         th:if="${error}"
         th:text="${error}">
    </div>

    <form th:action="@{/vendor/products/edit/{id}(id=${product.productId})}"
          method="post">

        <div class="form-group">
            <label>Product Name</label>
            <input type="text"
                   name="productName"
                   th:value="${product.productName}"
                   required>
        </div>

        <div class="form-group">
            <label>Category</label>
            <input type="text"
                   name="category"
                   th:value="${product.category}"
                   required>
        </div>

        <div class="form-group">
            <label>Price (₹)</label>
            <input type="number"
                   name="price"
                   step="0.01"
                   min="0.01"
                   th:value="${product.price}"
                   required>
        </div>

        <div class="form-group">
            <label>Discount Percentage</label>
            <input type="number"
                   name="discountPercentage"
                   min="0"
                   max="100"
                   step="0.01"
                   th:value="${product.discountPercentage}">
        </div>

        <div class="form-group">
            <label>Stock Quantity</label>
            <input type="number"
                   name="stockQuantity"
                   min="0"
                   th:value="${product.stockQuantity}"
                   required>
        </div>

        <div class="buttons">
            <button type="submit">Save Changes</button>

            <a th:href="@{/vendor/products}" class="back-btn">
                Cancel
            </a>
        </div>

    </form>

</div>

</body>
</html>
