<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | OneCart</title>
    <link rel="stylesheet" th:href="@{/css/login.css}">
</head>
<body>
<header class="topbar">
    <a class="brand" th:href="@{/}">
        <span class="brand-mark">O</span><span>OneCart</span>
    </a>
    <a class="back-link" th:href="@{/}">← Back to home</a>
</header>

<main class="page">
    <section class="login-card">
        <div class="card-heading">
            <p class="eyebrow">JOIN ONECART</p>
            <h1>Create your account</h1>
            <p class="subtitle">Shop your favorite stores or start selling.</p>
        </div>

        <p class="message error" th:if="${error}" th:text="${error}"></p>

        <form th:action="@{/signup}" method="post" id="signupForm">
            <label for="firstName">First name</label>
            <input id="firstName" name="firstName" type="text" required maxlength="255">

            <label for="lastName">Last name</label>
            <input id="lastName" name="lastName" type="text" required maxlength="255">

            <label for="email">Email address</label>
            <input id="email" name="email" type="email" required maxlength="255"
                   autocomplete="email">

            <label for="role">Account type</label>
            <select id="role" name="role" required>
                <option value="CUSTOMER">Customer</option>
                <option value="VENDOR">Vendor</option>
            </select>

            <div id="businessNameGroup" hidden>
                <label for="businessName">Business name</label>
                <input id="businessName" name="businessName" type="text" maxlength="255">
            </div>

            <label for="password">Password</label>
            <div class="password-field">
                <input id="password" name="password" type="password"
                       required minlength="8" autocomplete="new-password">
                <button type="button" class="toggle-password"
                        data-password="password">Show</button>
            </div>

            <label for="confirmPassword">Confirm password</label>
            <div class="password-field">
                <input id="confirmPassword" name="confirmPassword" type="password"
                       required minlength="8" autocomplete="new-password">
                <button type="button" class="toggle-password"
                        data-password="confirmPassword">Show</button>
            </div>

            <button type="submit" class="submit-button" id="signupButton">
                Create account
            </button>
        </form>

        <p class="signup-prompt">
            Already have an account? <a th:href="@{/login}">Sign in</a>
        </p>
    </section>
</main>

<script th:src="@{/js/login.js}"></script>
</body>
</html>
