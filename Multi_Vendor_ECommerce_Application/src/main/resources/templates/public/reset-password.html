<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | OneCart</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<header class="auth-header">
    <a class="brand" th:href="@{/}">One<span>Cart</span></a>
    <a class="back-link" th:href="@{/login}">Back to login</a>
</header>

<main class="auth-page">
    <section class="auth-card">
        <div class="auth-icon">✓</div>
        <p class="eyebrow">CREATE A NEW PASSWORD</p>
        <h1>Reset your password</h1>
        <p class="intro">Choose a new password for your OneCart account.</p>

        <form th:action="@{/reset-password}" method="post">
            <input type="hidden" name="token" th:value="${token}">

            <label for="password">New password</label>
            <input
                id="password"
                type="password"
                name="password"
                placeholder="Enter new password"
                autocomplete="new-password"
                minlength="8"
                required>

            <label for="confirmPassword">Confirm new password</label>
            <input
                id="confirmPassword"
                type="password"
                name="confirmPassword"
                placeholder="Re-enter new password"
                autocomplete="new-password"
                minlength="8"
                required>

            <button class="primary-button" type="submit">Update password</button>
        </form>

        <p class="auth-footer">
            <a th:href="@{/login}">Return to sign in</a>
        </p>
    </section>
</main>
</body>
</html>
