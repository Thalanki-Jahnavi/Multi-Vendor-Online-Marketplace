<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | OneCart</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<header class="auth-header">
    <a class="brand" th:href="@{/}">One<span>Cart</span></a>
    <a class="back-link" th:href="@{/login}">Back to login</a>
</header>

<main class="auth-page">
    <section class="auth-card">
        <div class="auth-icon">↻</div>
        <p class="eyebrow">ACCOUNT RECOVERY</p>
        <h1>Forgot your password?</h1>
        <p class="intro">
            Enter the email address you used to register. We’ll send you
            instructions to reset your password.
        </p>

        <form th:action="@{/forgot-password}" method="post">
            <label for="email">Registered email</label>
            <input
                id="email"
                type="email"
                name="email"
                placeholder="you@example.com"
                autocomplete="email"
                required>

            <button class="primary-button" type="submit">Send reset link</button>
        </form>

        <p class="auth-footer">
            Remembered your password?
            <a th:href="@{/login}">Sign in</a>
        </p>
    </section>
</main>
</body>
</html>
